name: inspection_app
description: Dashboard inspection industrielle — MQTT + YOLO
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # MQTT
  mqtt_client: ^10.0.0

  # Graphiques SPC
  fl_chart: ^0.68.0

  # Appels REST vers FastAPI
  dio: ^5.4.3

  # Navigation
  go_router: ^13.2.0

  # Scan QR code lot
  mobile_scanner: ^5.2.3

  # Notifications locales
  flutter_local_notifications: ^17.2.1

  # Config persistante (IP broker, seuils)
  shared_preferences: ^2.2.3

  # Modèles immutables
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Génération de code
  build_runner: ^2.4.9
  freezed:
flutter:
  uses-material-design: true   # ← vérifie que cette ligne existe